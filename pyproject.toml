[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-defender"
version = "1.0.0"
description = "Autonomous host defender: detects suspicious processes and connections, then responds within a bounded policy — with a hash-chained audit trail of every decision."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["security", "defense", "edr", "dfir", "incident-response", "linux"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
vigil = "vigil.cli:main"

[tool.setuptools]
packages = ["vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
